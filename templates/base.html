<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}产业链研究工作台{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
    <!-- 侧边栏 -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">⬡</span>
                <div>
                    <div class="logo-title">产业链研究工作台</div>
                    <div class="logo-sub">安徽产研院 · 材料事业部</div>
                </div>
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                <span class="nav-icon">📊</span> 仪表盘</a></li>
            <li><a href="/chain-map" class="nav-link {% if request.path == '/chain-map' %}active{% endif %}">
                <span class="nav-icon">🗺️</span> 产业链图谱</a></li>
            <li><a href="/nodes" class="nav-link {% if request.path == '/nodes' %}active{% endif %}">
                <span class="nav-icon">📋</span> 节点管理</a></li>
            <li><a href="/sources" class="nav-link {% if request.path == '/sources' %}active{% endif %}">
                <span class="nav-icon">📚</span> 来源管理</a></li>
            <li><a href="/workflow" class="nav-link {% if request.path == '/workflow' %}active{% endif %}">
                <span class="nav-icon">⚙️</span> 工作流</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="搜索节点..." autocomplete="off">
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
