<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产业链研究工作台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: block;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            margin: 0;
        }
        .home-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        .home-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .home-header h1 {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .home-header p {
            color: #94a3b8;
            font-size: 16px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .project-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            color: #e2e8f0;
            display: block;
        }
        .project-card:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }
        .project-icon {
            font-size: 36px;
            margin-bottom: 16px;
        }
        .project-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .project-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .project-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-active {
            background: rgba(59,130,246,0.2);
            color: #60a5fa;
        }
        .status-done {
            background: rgba(34,197,94,0.2);
            color: #4ade80;
        }
        .project-progress {
            font-size: 13px;
            color: #64748b;
        }
        .project-progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .project-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 2px;
            transition: width 0.3s;
        }
        .new-project-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.25s;
            color: #64748b;
            font-size: 15px;
            text-decoration: none;
        }
        .new-project-btn:hover {
            border-color: rgba(255,255,255,0.3);
            color: #94a3b8;
            background: rgba(255,255,255,0.06);
        }
        .new-project-form {
            display: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px;
        }
        .new-project-form.active { display: block; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #3b82f6;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-create {
            padding: 10px 24px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-cancel {
            padding: 10px 24px;
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-header">
            <h1>⬡ 产业链研究工作台</h1>
            <p>系统拆解产业链 · 识别技术需求 · 发现合作机会</p>
        </div>

        <div class="project-grid" id="projectGrid">
            <!-- 项目卡片动态加载 -->
        </div>

        <!-- 新建项目 -->
        <div class="new-project-btn" id="newProjectBtn" onclick="showForm()">
            ＋ 新建产业研究项目
        </div>

        <div class="new-project-form" id="newProjectForm">
            <div class="form-group">
                <label>项目名称（作为唯一标识）</label>
                <input type="text" id="projName" placeholder="例如：新材料">
            </div>
            <div class="form-group">
                <label>显示名称</label>
                <input type="text" id="projDisplayName" placeholder="例如：新材料产业链">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea id="projDesc" rows="2" placeholder="简要描述研究范围"></textarea>
            </div>
            <div class="form-group">
                <label>图标（emoji）</label>
                <input type="text" id="projIcon" placeholder="🧪" value="🧪">
            </div>
            <div class="form-actions">
                <button class="btn-create" onclick="createProject()">创建项目</button>
                <button class="btn-cancel" onclick="hideForm()">取消</button>
            </div>
        </div>
    </div>

    <script>
    async function loadProjects() {
        const res = await fetch('/api/projects');
        const data = await res.json();
        const grid = document.getElementById('projectGrid');

        grid.innerHTML = (data.projects || []).map(p => {
            const pct = p.total_nodes > 0 ? Math.round(p.done_nodes * 100 / p.total_nodes) : 0;
            const statusClass = p.status === '已完成' ? 'status-done' : 'status-active';
            return `
                <a href="/${encodeURIComponent(p.id)}/" class="project-card">
                    <div class="project-icon">${p.icon || '📊'}</div>
                    <div class="project-name">${p.name}</div>
                    <div class="project-desc">${p.description || ''}</div>
                    <div class="project-meta">
                        <span class="project-status ${statusClass}">${p.status}</span>
                        <span class="project-progress">${p.done_nodes}/${p.total_nodes} 节点</span>
                    </div>
                    <div class="project-progress-bar">
                        <div class="project-progress-fill" style="width: ${pct}%"></div>
                    </div>
                </a>
            `;
        }).join('');
    }

    function showForm() {
        document.getElementById('newProjectBtn').style.display = 'none';
        document.getElementById('newProjectForm').classList.add('active');
    }

    function hideForm() {
        document.getElementById('newProjectBtn').style.display = 'flex';
        document.getElementById('newProjectForm').classList.remove('active');
    }

    async function createProject() {
        const name = document.getElementById('projName').value.trim();
        if (!name) { alert('请输入项目名称'); return; }

        const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                display_name: document.getElementById('projDisplayName').value.trim() || name,
                description: document.getElementById('projDesc').value.trim(),
                icon: document.getElementById('projIcon').value.trim() || '📊',
            })
        });
        const data = await res.json();
        if (data.ok) {
            hideForm();
            loadProjects();
        } else {
            alert(data.error || '创建失败');
        }
    }

    loadProjects();
    </script>
</body>
</html>
