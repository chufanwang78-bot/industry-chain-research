# 产业链研究工作流配置
# 版本: v2.0 — 四视角交叉结构
# 核心理念: 产品/过程/材料/设备四个视角 → 企业 → 区域筛选 → 新闻 → 产研院机会

research:
  organization: "安徽长三角产业创新研究院"
  department: "材料事业部"
  researcher: "王楚帆"
  current_industry: "芯片"
  start_date: "2025-10-15"
  methodology: "产品拆解驱动 + 工艺流程驱动 + 材料设备追溯 → 企业匹配 → 区域聚焦 → 新闻追踪"

industries:
  芯片:
    code: "IC"
    top_categories:

      # ===================== 产品视角 =====================
      - id: "01"
        name: "产品视角"
        relation_type: "TAX"
        description: "芯片产品分类，各品类的特点、制程、应用场景、代表企业"
        subcategories:
          - id: "01.01"
            name: "数字芯片"
            subcategories:
              - id: "01.01.01"
                name: "处理器(CPU/GPU/AP)"
              - id: "01.01.02"
                name: "逻辑芯片(FPGA/ASIC)"
              - id: "01.01.03"
                name: "SoC芯片"
          - id: "01.02"
            name: "存储芯片"
            subcategories:
              - id: "01.02.01"
                name: "DRAM"
              - id: "01.02.02"
                name: "NAND Flash"
              - id: "01.02.03"
                name: "NOR Flash"
          - id: "01.03"
            name: "模拟芯片"
            subcategories:
              - id: "01.03.01"
                name: "电源管理芯片"
              - id: "01.03.02"
                name: "信号链芯片(ADC/DAC/运放)"
              - id: "01.03.03"
                name: "射频芯片"
          - id: "01.04"
            name: "功率器件"
            subcategories:
              - id: "01.04.01"
                name: "硅基功率器件(IGBT/MOSFET)"
              - id: "01.04.02"
                name: "碳化硅(SiC)器件"
              - id: "01.04.03"
                name: "氮化镓(GaN)器件"
          - id: "01.05"
            name: "传感器芯片"
            subcategories:
              - id: "01.05.01"
                name: "CMOS图像传感器(CIS)"
              - id: "01.05.02"
                name: "MEMS传感器"
          - id: "01.06"
            name: "光电子芯片"
            subcategories:
              - id: "01.06.01"
                name: "LED芯片"
              - id: "01.06.02"
                name: "激光器/光通信芯片"

      # ===================== 制造过程视角 =====================
      - id: "10"
        name: "制造过程视角"
        relation_type: "PROC"
        description: "芯片制造的完整流程，每道工序的工艺原理、用料、产出、设备"
        subcategories:
          - id: "10.01"
            name: "拉晶(单晶硅锭生长)"
            subcategories:
              - id: "10.01.01"
                name: "直拉法(CZ)"
              - id: "10.01.02"
                name: "区熔法(FZ)"
          - id: "10.02"
            name: "切片与研磨"
          - id: "10.03"
            name: "抛光(CMP)"
          - id: "10.04"
            name: "光刻"
            subcategories:
              - id: "10.04.01"
                name: "涂胶/前烘"
              - id: "10.04.02"
                name: "曝光"
              - id: "10.04.03"
                name: "显影/后烘"
          - id: "10.05"
            name: "刻蚀"
            subcategories:
              - id: "10.05.01"
                name: "干法刻蚀"
              - id: "10.05.02"
                name: "湿法刻蚀"
          - id: "10.06"
            name: "薄膜沉积"
            subcategories:
              - id: "10.06.01"
                name: "CVD(化学气相沉积)"
              - id: "10.06.02"
                name: "PVD(物理气相沉积)"
              - id: "10.06.03"
                name: "ALD(原子层沉积)"
          - id: "10.07"
            name: "离子注入"
          - id: "10.08"
            name: "清洗"
          - id: "10.09"
            name: "检测与量测"
          - id: "10.10"
            name: "封装"
            subcategories:
              - id: "10.10.01"
                name: "传统封装(DIP/SOP/QFP/BGA)"
              - id: "10.10.02"
                name: "先进封装(WLP/2.5D/3D/Chiplet)"
          - id: "10.11"
            name: "测试"
            subcategories:
              - id: "10.11.01"
                name: "晶圆测试(CP)"
              - id: "10.11.02"
                name: "成品测试(FT)"

      # ===================== 材料视角 =====================
      - id: "20"
        name: "材料视角"
        relation_type: "SUPP"
        description: "芯片制造所需各类材料的性能、供应商、国产化、安徽资源"
        subcategories:
          - id: "20.01"
            name: "硅片/衬底"
          - id: "20.02"
            name: "光刻胶及配套材料"
            subcategories:
              - id: "20.02.01"
                name: "g/i线光刻胶"
              - id: "20.02.02"
                name: "KrF光刻胶"
              - id: "20.02.03"
                name: "ArF/EUV光刻胶"
              - id: "20.02.04"
                name: "配套试剂(显影液/去胶液/稀释剂)"
          - id: "20.03"
            name: "电子特气"
          - id: "20.04"
            name: "湿电子化学品"
          - id: "20.05"
            name: "靶材/蒸发料"
          - id: "20.06"
            name: "CMP抛光材料"
          - id: "20.07"
            name: "掩膜版"
          - id: "20.08"
            name: "封装基板/引线框架"
          - id: "20.09"
            name: "第三代半导体衬底(SiC/GaN)"
          - id: "20.10"
            name: "其他材料(石英坩埚/金刚线/光罩等)"

      # ===================== 设备视角 =====================
      - id: "30"
        name: "设备视角"
        relation_type: "SUPP"
        description: "芯片制造所需各类设备的供应商、国产化、安徽资源"
        subcategories:
          - id: "30.01"
            name: "单晶炉/拉晶设备"
          - id: "30.02"
            name: "切片机"
          - id: "30.03"
            name: "光刻机"
          - id: "30.04"
            name: "刻蚀设备"
          - id: "30.05"
            name: "薄膜沉积设备(CVD/PVD/ALD)"
          - id: "30.06"
            name: "离子注入设备"
          - id: "30.07"
            name: "CMP设备"
          - id: "30.08"
            name: "清洗设备"
          - id: "30.09"
            name: "检测/量测设备"
          - id: "30.10"
            name: "封装设备"
          - id: "30.11"
            name: "测试设备"

      # ===================== 产业机会汇总 =====================
      - id: "90"
        name: "产业机会汇总"
        relation_type: "TAX"
        description: "安徽/长三角企业、新闻动态、产研院合作机会"
        subcategories:
          - id: "90.01"
            name: "安徽企业清单"
          - id: "90.02"
            name: "长三角企业清单"
          - id: "90.03"
            name: "新闻/事件追踪"
          - id: "90.04"
            name: "产研院合作切入点"
          - id: "90.05"
            name: "研究总结与报告"

# 研究深度参数
depth_control:
  min_enterprises_per_node: 3
  max_enterprises_per_node: 10
  min_sources_per_node: 3
  require_region_scan: true
  require_opportunity_analysis: true
  require_news_tracking: true

# 质量控制
quality_control:
  forbid_fabrication: true
  require_source_for_claims: true
  flag_inference: true
  check_relevance: true

# 输出配置
output:
  report_format: "markdown"
  chart_format: "html"
  language: "zh-CN"
